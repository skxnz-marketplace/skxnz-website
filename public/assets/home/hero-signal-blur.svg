<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#0b1c27" />
      <stop offset="45%" stop-color="#123244" />
      <stop offset="78%" stop-color="#1d5266" />
      <stop offset="100%" stop-color="#2b6b7e" />
    </linearGradient>

    <radialGradient id="tealGlow" cx="88%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#3d8ea3" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#3d8ea3" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cornerDark" cx="14%" cy="6%" r="55%">
      <stop offset="0%" stop-color="#050d14" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050d14" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="smearCore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d0409" stop-opacity="0.85" />
      <stop offset="28%" stop-color="#c60c12" stop-opacity="0.98" />
      <stop offset="62%" stop-color="#e21419" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#8a060c" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="smearLow" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#a4070d" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#6d0509" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4a0206" stop-opacity="0" />
    </linearGradient>

    <!-- Horizontal-weighted blur: reads as camera motion drag -->
    <filter id="drag" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="74 26" />
    </filter>
    <filter id="softMass" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="58" />
    </filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="110" />
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n" />
      <feColorMatrix type="saturate" values="0" in="n" />
    </filter>
  </defs>

  <!-- Base field: navy left, teal right -->
  <rect width="1920" height="1080" fill="url(#field)" />
  <rect width="1920" height="1080" fill="url(#tealGlow)" />

  <!-- Silhouetted head/shoulder mass, right of centre -->
  <g filter="url(#softMass)" opacity="0.72">
    <ellipse cx="1330" cy="430" rx="290" ry="330" fill="#0a2029" />
    <ellipse cx="1240" cy="880" rx="470" ry="300" fill="#0a2029" />
  </g>

  <!-- Red motion smear -->
  <g filter="url(#drag)">
    <rect x="180" y="150" width="1180" height="360" rx="180" fill="url(#smearCore)" />
    <rect x="240" y="300" width="900" height="480" rx="220" fill="url(#smearLow)" opacity="0.85" />
    <rect x="120" y="620" width="640" height="420" rx="200" fill="#8c060c" opacity="0.6" />
    <rect x="430" y="80" width="720" height="120" rx="60" fill="#e2151a" opacity="0.45" />
  </g>

  <!-- Bright bloom inside the smear -->
  <g filter="url(#haze)" opacity="0.55">
    <ellipse cx="640" cy="330" rx="330" ry="150" fill="#ff2a22" />
  </g>

  <!-- Corner falloff -->
  <rect width="1920" height="1080" fill="url(#cornerDark)" />

  <!-- Film grain -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.16" style="mix-blend-mode:overlay" />
</svg>
