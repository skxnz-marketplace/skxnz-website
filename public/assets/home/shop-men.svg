<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" width="1200" height="900">
  <defs>
    <linearGradient id="mBase" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#0a1723" />
      <stop offset="55%" stop-color="#12293c" />
      <stop offset="100%" stop-color="#1b3e56" />
    </linearGradient>
    <radialGradient id="mGlow" cx="30%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#31708f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#31708f" stop-opacity="0" />
    </radialGradient>
    <filter id="mSoft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="mGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n" />
      <feColorMatrix type="saturate" values="0" in="n" />
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#mBase)" />
  <rect width="1200" height="900" fill="url(#mGlow)" />
  <g filter="url(#mSoft)" opacity="0.5">
    <ellipse cx="760" cy="360" rx="240" ry="300" fill="#071119" />
    <ellipse cx="700" cy="820" rx="420" ry="260" fill="#071119" />
  </g>
  <rect width="1200" height="900" filter="url(#mGrain)" opacity="0.15" style="mix-blend-mode:overlay" />
</svg>
