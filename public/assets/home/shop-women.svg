<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" width="1200" height="900">
  <defs>
    <linearGradient id="wBase" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1d0710" />
      <stop offset="55%" stop-color="#3a0f1e" />
      <stop offset="100%" stop-color="#5c1b2c" />
    </linearGradient>
    <radialGradient id="wGlow" cx="68%" cy="30%" r="52%">
      <stop offset="0%" stop-color="#b0616b" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#b0616b" stop-opacity="0" />
    </radialGradient>
    <filter id="wSoft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="wGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n" />
      <feColorMatrix type="saturate" values="0" in="n" />
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#wBase)" />
  <rect width="1200" height="900" fill="url(#wGlow)" />
  <g filter="url(#wSoft)" opacity="0.5">
    <ellipse cx="420" cy="340" rx="240" ry="300" fill="#160409" />
    <ellipse cx="500" cy="820" rx="420" ry="260" fill="#160409" />
  </g>
  <rect width="1200" height="900" filter="url(#wGrain)" opacity="0.15" style="mix-blend-mode:overlay" />
</svg>
