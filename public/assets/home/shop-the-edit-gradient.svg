<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none" width="1600" height="900">
  <defs>
    <radialGradient id="bloomA" cx="24%" cy="34%" r="46%">
      <stop offset="0%" stop-color="#c4897e" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#a4585a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#8b3238" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bloomB" cx="72%" cy="70%" r="42%">
      <stop offset="0%" stop-color="#cf9b8c" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a9635f" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#8b3238" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bloomC" cx="52%" cy="14%" r="34%">
      <stop offset="0%" stop-color="#b06b66" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7d272c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shadeA" cx="8%" cy="82%" r="40%">
      <stop offset="0%" stop-color="#5c1a20" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#5c1a20" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shadeB" cx="96%" cy="8%" r="38%">
      <stop offset="0%" stop-color="#611d23" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#611d23" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b262c" />
      <stop offset="50%" stop-color="#8d3339" />
      <stop offset="100%" stop-color="#732329" />
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="mono" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)" />
  <rect width="1600" height="900" fill="url(#bloomC)" />
  <rect width="1600" height="900" fill="url(#bloomA)" />
  <rect width="1600" height="900" fill="url(#bloomB)" />
  <rect width="1600" height="900" fill="url(#shadeA)" />
  <rect width="1600" height="900" fill="url(#shadeB)" />
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:overlay" />
</svg>
